<title>Observa · MVP S10 de comprensión | GORE Ayacucho</title>
<style>
:root{--ink:#173c38;--text:#293c3a;--muted:#586964;--paper:#f5f6f0;--white:#fff;--line:#dce3d9;--sage:#e5eddf;--blue:#e7eff5;--amber:#fff1d6;--accent:#b45a3c;--shadow:0 10px 35px #193a3010}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button,a,input,select,textarea,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #30788a}button{border:1px solid var(--line);border-radius:9px;padding:11px 18px;color:var(--ink);background:white;font-weight:650}button:hover:not(:disabled){background:var(--sage)}.primary{background:var(--ink);color:white;border-color:var(--ink)}.primary:hover:not(:disabled){background:#28564d}.danger{color:#983c2e}.small{font-size:13px}.muted{color:var(--muted)}a{color:#256268}header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(24px,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:40px;height:40px;background:var(--ink);color:white;border-radius:11px;font:28px Georgia}.brand strong{font-size:20px;letter-spacing:-.6px}.brand small{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}nav{display:flex;gap:8px}nav button{font-size:14px;padding:8px 14px}nav button[aria-current]{background:var(--sage);border-color:#a1b59c}.ribbon{font-size:12px;letter-spacing:.4px;text-align:center;background:#e9eee5;padding:7px 15px;color:#425e50}main{max-width:1260px;margin:0 auto;padding:35px 28px 60px}.eyebrow{color:var(--accent);font-weight:750;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}h1,h2,h3{color:var(--ink);line-height:1.15}h1{font:clamp(30px,4vw,48px)/1.13 Georgia,serif;margin:12px 0 18px;letter-spacing:-1px}h2{font:28px/1.2 Georgia,serif;margin:0 0 15px}h3{font-size:17px;margin:0 0 10px}p{margin:0 0 16px}.intro{max-width:740px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.landing{grid-template-columns:.95fr 1.05fr;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:27px;box-shadow:var(--shadow)}.tint{background:var(--sage)}.blue{background:var(--blue)}.note{padding:14px 17px;border-radius:9px;background:var(--blue);font-size:14px;margin:15px 0}.warn{background:var(--amber)}.badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:20px;background:var(--sage);font-size:12px;font-weight:700}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.stack>*+*{margin-top:15px}label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}input[type=text],select,textarea{width:100%;border:1px solid #a6b4aa;border-radius:8px;background:white;color:var(--text);padding:11px 12px}textarea{min-height:95px;resize:vertical;line-height:1.5}input[type=checkbox]{width:19px;height:19px;flex-shrink:0;margin-top:3px;accent-color:var(--ink)}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400;font-size:14px}.field{margin-bottom:17px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}.hero-art{margin:26px 0;padding:24px;background:var(--sage);border-radius:16px;position:relative}.sheet{background:white;border:1px solid #cbd8c4;border-radius:10px;padding:18px;max-width:330px;margin:auto;box-shadow:7px 8px 0 #cfddc7}.sheet-line{height:8px;border-radius:4px;background:#dce6d4;margin:10px 0}.sheet-line:nth-child(2){width:70%}.sheet-line:nth-child(4){width:80%}.steps{display:flex;gap:0;margin:22px 0 30px}.step{flex:1;border-top:5px solid var(--line);padding:10px 8px;font-size:13px;color:var(--muted)}.step.active{border-color:var(--ink);color:var(--ink);font-weight:750}.step.done{border-color:#84a17b}.task-grid{grid-template-columns:1.08fr .92fr}.case-block{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.case-block h3{font-size:14px;color:#537047}.continuous{line-height:1.85}.case-meta{font-size:13px;color:var(--muted)}.response-label{margin-bottom:5px}.instruction{font-size:14px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:20px}.error{color:#a03121;background:#fff1ed;border-radius:7px;padding:12px;margin:14px 0}.hidden{display:none!important}.answer{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid #abc2a2;padding:10px 14px;background:#f6f8f3;margin:8px 0 20px}details{border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;background:white}summary{cursor:pointer;font-weight:650;color:var(--ink)}details[open] summary{margin-bottom:18px}.metric{font:38px Georgia;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat{padding:18px;background:#f1f5ec;border-radius:10px}.divider{border:0;border-top:1px solid var(--line);margin:26px 0}footer{max-width:1260px;margin:auto;padding:18px 28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#eef3e9}ul,ol{padding-left:23px}li{margin-bottom:8px}.review-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.empty{padding:40px;text-align:center;border:1px dashed #acbca5;border-radius:14px}dialog{max-width:510px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:15px;padding:26px;box-shadow:var(--shadow);color:var(--text)}dialog::backdrop{background:#173b3866}.status{min-height:24px;color:#3b654d;font-size:14px}.subtle-button{padding:6px 10px;font-size:12px;background:transparent}.sticky{position:sticky;top:18px;align-self:start}.privacy{font-size:13px;color:var(--muted)}@media(max-width:850px){.grid,.landing,.task-grid{grid-template-columns:1fr}.sticky{position:static}header{flex-wrap:wrap}main{padding:25px 18px}.card{padding:20px}.review-fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.step{font-size:12px}.hero-art{display:none}nav{width:100%}h1{font-size:34px}}@media print{header,nav,.ribbon,footer,button,.no-print{display:none!important}main{padding:0}.card{box-shadow:none;break-inside:avoid}details{display:block}.grid{display:block}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark" aria-hidden="true">o</div><div><strong>observa</strong><small>GORE Ayacucho · Laboratorio de servicio</small></div></div><nav aria-label="Navegación principal"><button id="sessionNav" aria-current="page">Sesión</button><button id="guideNav">Guía de la tribu</button><button id="reviewNav">Facilitador</button></nav></header>
<div class="ribbon">MVP DE INVESTIGACIÓN · ENTORNO CONTROLADO · NO REALIZA TRÁMITES NI EMITE CONFORMIDAD</div>
<main id="app"></main>
<footer><div class="row between"><span>Observa / HS01 · S10 / 2.2.0 · Una tarea: interpretar una observación.</span><span>Respuestas solo en memoria del navegador. Exportar antes de cerrar.</span></div></footer>
<dialog id="dialog"><h2 id="dialogTitle"></h2><p id="dialogText"></p><div class="actions"><button id="dialogNo">Cancelar</button><button id="dialogYes" class="primary">Continuar</button></div></dialog>
<script>
'use strict';
const VERSION='2.2.0-ACUERDO-TECNICO';
let CASES={
 A:{id:'DEMO-A',title:'Correspondencia del cronograma',context:'Solicitud ficticia de ampliación de plazo de una obra de drenaje. Usted apoya la preparación de la respuesta. No debe calcular ni aprobar una ampliación.',parts:[
 ['Qué se observó','El cronograma presentado no identifica cuáles actividades fueron afectadas ni muestra cómo su afectación modifica la fecha de culminación de la obra.'],
 ['Por qué se solicita la corrección','Para este ejercicio, la revisión requiere relacionar las actividades afectadas con la secuencia del cronograma y con la fecha de culminación. Esta es una pauta didáctica, no una norma ni una evaluación de procedencia.'],
 ['Qué debe corregirse','Identificar las actividades afectadas y explicar su relación con la secuencia del cronograma y el cambio de la fecha de culminación. Actualizar el cronograma para que coincida con la explicación.'],
 ['Qué evidencia debe presentarse','Presentar el cronograma actualizado y un informe explicativo que relacione las actividades afectadas con el cambio de la fecha de culminación.']
 ],rubric:[
 'Reconoce ambas omisiones: actividades afectadas e incidencia en la fecha de culminación.',
 'Propone identificar actividades, explicar su efecto en secuencia y culminación y actualizar el cronograma de forma coherente.',
 'Identifica cronograma actualizado e informe explicativo; relaciona ambos con el efecto de las actividades en la culminación.'
 ]},
 B:{id:'DEMO-B',title:'Correspondencia de fechas y sustento',context:'Solicitud ficticia de ampliación de plazo de una obra de saneamiento. Usted apoya la preparación de la respuesta. No debe calcular ni aprobar una ampliación.',parts:[
 ['Qué se observó','Las fechas de inicio y fin de la afectación consignadas en el informe no coinciden con las fechas de los asientos de obra citados como sustento. No se explica la diferencia.'],
 ['Por qué se solicita la corrección','Para este ejercicio, la revisión requiere relacionar el periodo señalado en el informe con los registros que lo sustentan. Esta es una pauta didáctica, no una norma ni una evaluación de procedencia.'],
 ['Qué debe corregirse','Contrastar las fechas del informe con los asientos citados, corregir las discrepancias que correspondan y explicar qué registros sustentan el inicio y el fin del periodo.'],
 ['Qué evidencia debe presentarse','Presentar el informe corregido y una copia de los asientos de obra citados, identificando los registros que sustentan el inicio y el fin del periodo.']
 ],rubric:[
 'Reconoce discrepancia entre fechas del informe y asientos y falta de explicación de esa diferencia.',
 'Propone contrastar fechas, corregir discrepancias y justificar inicio y fin del periodo con sus registros.',
 'Identifica informe corregido y copia de asientos citados, y explica la correspondencia con inicio y fin.'
 ]}
};
CASES.A.rubric.splice(1,0,'Explica que debe poder relacionarse la afectación con la secuencia del cronograma y su efecto sobre la fecha final; no confunde ese criterio con aprobación de la causal.');
CASES.B.rubric.splice(1,0,'Explica que el periodo informado debe corresponder con los registros de sustento para poder revisarlo; no presupone que una ampliación ya fue aprobada.');
const DEMO_CASES=JSON.parse(JSON.stringify(CASES));
let DATASET={version:'DEMO-2.0',source:'demo',note:'Texto continuo de práctica construido para este MVP; no procede de expedientes del GORE.'};
const SEQUENCES={
 S1:[['A','continuo'],['B','estructurado']],
 S2:[['A','estructurado'],['B','continuo']],
 S3:[['B','continuo'],['A','estructurado']],
 S4:[['B','estructurado'],['A','continuo']]
};
const QUESTIONS=['¿Qué se ha observado en el expediente?','¿Por qué se solicita esa corrección?','¿Qué corrección prepararía?','¿Qué documentos presentaría y qué sustenta cada uno?'];

let session=null,stage='setup',view='session',draft=['','','',''],round=0,records=[],events=[],clockStart=null,elapsed=0,paused=false,help=0,dirty=false,manualPause=false;
let setup={code:'',role:'Residente de obra',kind:'ensayo',seq:'S1',checked:false,eligible:false,consent:false};
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const log=(type,detail={})=>{if(session)events.push({at:new Date().toISOString(),round:round+1,type,...detail});};
function startClock(){if(clockStart===null&&!paused&&!document.hidden)clockStart=performance.now();}
function stopClock(){if(clockStart!==null){elapsed+=performance.now()-clockStart;clockStart=null;}}
function activeSeconds(){return Math.round((elapsed+(clockStart===null?0:performance.now()-clockStart))/1000);}
function confirmAction(title,text,yes,callback){$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogYes').textContent=yes;$('dialogYes').onclick=()=>{$('dialog').close();callback();};$('dialogNo').onclick=()=>$('dialog').close();$('dialog').showModal();}
function focusHeading(){requestAnimationFrame(()=>{const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}window.scrollTo(0,0);});}
function shell(){for(const id of ['sessionNav','guideNav','reviewNav'])$(id).removeAttribute('aria-current');$(view==='guide'?'guideNav':view==='review'?'reviewNav':'sessionNav').setAttribute('aria-current','page');$('guideNav').disabled=!!session&&stage!=='done';$('reviewNav').disabled=!!session&&stage!=='done';}
function render(){shell();if(view==='guide')renderGuide();else if(view==='review')renderReview();else if(stage==='setup')renderSetup();else if(stage==='task')renderTask();else if(stage==='summary')renderSummary();else if(stage==='between')renderBetween();else renderDone();focusHeading();}
function renderSetup(){app.innerHTML=`<div class="grid landing"><section><div class="eyebrow">Del expediente a la acción</div><h1>Leer. Comprender.<br>Explicar el siguiente paso.</h1><p class="intro">Revise dos observaciones del ejercicio y explique con sus palabras cómo las atendería.</p><div class="hero-art" aria-hidden="true"><div class="sheet"><span class="badge">Expediente de práctica</span><div class="sheet-line"></div><div class="sheet-line"></div><div class="sheet-line"></div><div class="row"><span class="badge">Observación</span><span>→</span><span class="badge">Respuesta</span></div></div></div><div class="note"><strong>Una sola tarea, repetida en dos casos.</strong><br>No necesita elaborar cálculos ni adjuntar archivos. Puede consultar la observación mientras responde. Es válido indicar que no sabe o que necesita una aclaración.</div><p class="privacy">No escriba nombres, DNI, datos de obras ni información reservada. Use solo códigos y material ficticio o anonimizado autorizado. La aplicación no envía sus respuestas a un servidor.</p></section><section class="card"><h2>Preparar la sesión</h2><p class="muted small">Configuración a cargo del facilitador. Tiempo orientativo: 10–12 minutos por persona. Cuatro respuestas por caso.</p><form id="setupForm"><div class="grid"><div class="field"><label for="code">Código del participante</label><input id="code" type="text" maxlength="16" pattern="(?:[A-Za-z0-9_]|-)+" placeholder="Ej. P01" autocomplete="off" required value="${esc(setup.code)}"><div class="small muted">Código anónimo, sin nombre.</div></div><div class="field"><label for="kind">Tipo de sesión</label><select id="kind"><option value="ensayo">Ensayo técnico · no es evidencia</option><option value="real">Prueba con una persona real</option></select></div></div><div class="field"><label for="role">Rol del participante</label><select id="role"><option>Residente de obra</option><option>Asistente de residencia</option><option>Asistente de supervisión</option><option>Evaluador técnico</option><option>Equipo de diseño · ensayo</option></select></div><div class="field"><label for="seq">Orden de los casos · lo selecciona el facilitador</label><select id="seq"><option value="S1">S1 · A continuo → B estructurado</option><option value="S2">S2 · A estructurado → B continuo</option><option value="S3">S3 · B continuo → A estructurado</option><option value="S4">S4 · B estructurado → A continuo</option></select><p class="small muted">Cada persona interpreta dos casos distintos, uno por formato. Rotar S1–S4 equilibra el orden. No elegir según la habilidad del participante.</p></div><label class="check"><input id="eligible" type="checkbox" ${setup.eligible?'checked':''}> <span>El facilitador confirma que esta persona prepara o coordina subsanaciones. Requerido para una prueba real del segmento objetivo.</span></label><label class="check"><input id="technical" type="checkbox" ${setup.checked?'checked':''}> <span>El facilitador confirma que los evaluadores revisaron los mismos antecedentes y acordaron qué respuesta es suficiente y qué constituye un error crítico. No quedan desacuerdos técnicos sustantivos sobre estos casos.</span></label><div class="note warn"><strong>${DATASET.source==='demo'?'Referencia simulada.':'Referencia configurada por la tribu.'}</strong> ${esc(DATASET.note)} Los formatos conservan exactamente las mismas frases, en el mismo orden. No se ha demostrado equivalencia de dificultad entre A y B.</div><label class="check"><input id="consent" type="checkbox" required ${setup.consent?'checked':''}> <span>Acepto participar voluntariamente y que el facilitador registre mis respuestas, acciones y tiempos con este código. Sé que puedo detenerme y solicitar su eliminación. Se evalúa el diseño, no mi desempeño laboral. No se graba audio ni video.</span></label><div id="setupError" role="alert"></div><div class="actions"><button type="button" id="configureCases">Configurar casos</button><button type="submit" class="primary">Comenzar tarea →</button></div></form></section></div>`;
 $('configureCases').onclick=renderConfig;
 $('kind').value=setup.kind;$('role').value=setup.role;$('seq').value=setup.seq;
 const sync=()=>{setup={code:$('code').value.trim(),role:$('role').value,kind:$('kind').value,seq:$('seq').value,checked:$('technical').checked,eligible:$('eligible').checked,consent:$('consent').checked};};
 $('setupForm').addEventListener('input',sync);$('setupForm').addEventListener('change',sync);
 $('setupForm').onsubmit=e=>{e.preventDefault();sync();if(setup.kind==='real'&&(!setup.eligible||setup.role==='Equipo de diseño · ensayo')){$('setupError').innerHTML='<div class="error">Confirme que la persona prepara o coordina subsanaciones y seleccione su rol. Para explorar con el equipo, utilice Ensayo técnico.</div>';return;}if(setup.kind==='real'&&!setup.checked){$('setupError').innerHTML='<div class="error">Antes de una prueba real, los evaluadores deben acordar el contenido y la pauta. Si persiste un desacuerdo técnico sustantivo, prioricen HS05. Puede explorar la aplicación como ensayo técnico.</div>';return;}session={id:'SES-'+Date.now(),version:VERSION,code:setup.code,role:setup.role,kind:setup.kind,sequence:setup.seq,eligibilityDeclared:setup.eligible,technicalReviewDeclared:setup.checked,technicalAgreementDeclared:setup.checked,technicalAgreementScope:"Solo casos y pauta de esta sesión; no valida HS05 institucional",consent:{accepted:true,at:new Date().toISOString(),textVersion:'1.0'},startedAt:new Date().toISOString(),baseline:DATASET.note,datasetVersion:DATASET.version,referenceType:DATASET.source,caseCalibrationDeclared:null};records=[];events=[];round=0;dirty=true;log('session_started');beginRound();};
}
function current(){const [key,format]=SEQUENCES[session.sequence][round];return {key,format,data:CASES[key]};}
function beginRound(){stage='task';draft=['','','',''];elapsed=0;clockStart=null;help=0;paused=false;manualPause=false;log('case_opened',{case:current().key,format:current().format});startClock();render();}
function progress(n){return `<div class="steps" aria-label="Avance de la tarea"><div class="step ${n>1?'done':'active'}">01 · Leer y responder</div><div class="step ${n===2?'active':n>2?'done':''}">02 · Revisar</div><div class="step ${n===3?'active':''}">03 · Registrar</div></div>`;}
function caseHTML(c){const body=c.format==='estructurado'?c.data.parts.map(([h,t])=>`<div class="case-block"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join(''):`<div class="case-block continuous"><p>${esc(c.data.parts.map(p=>p[1]).join(' '))}</p></div>`;return `<div class="row between"><span class="badge">${esc(c.data.id)} · ${DATASET.source==='demo'?'Ficticio':'Anonimizado · declarado'}</span><span class="case-meta">${c.format==='estructurado'?'Ficha por secciones':'Texto continuo'}</span></div><h2 style="margin-top:17px">${esc(c.data.title)}</h2><p class="case-meta">${esc(c.data.context)}</p>${body}`;}
function renderTask(){const c=current();app.innerHTML=`<div class="row between"><div><span class="eyebrow">Caso ${round+1} de 2 · ${esc(session.code)}</span><h1>¿Cómo atendería esta observación?</h1></div><button id="pauseBtn">${paused?'Reanudar':'Pausar'}</button></div>${progress(1)}<div id="pauseNotice" class="note warn ${paused?'':'hidden'}" role="status">Sesión en pausa. El tiempo activo está detenido.</div><div class="grid task-grid" id="taskArea"><article class="card">${caseHTML(c)}</article><section class="card sticky"><h2>Su interpretación</h2><p class="instruction">Explique con sus propias palabras. Puede volver a leer. Si no puede responder, indíquelo; no hay mínimo de caracteres.</p><form id="answerForm">${QUESTIONS.map((q,i)=>`<div class="field"><label for="answer${i}">${i+1}. ${q}</label><textarea id="answer${i}" maxlength="3000" placeholder="Escriba su respuesta…">${esc(draft[i])}</textarea></div>`).join('')}<div id="answerError" role="alert"></div><div class="actions"><button id="reviewAnswer" class="primary" type="submit">Revisar respuestas →</button></div></form><hr class="divider"><div class="row between"><button id="helpBtn" class="subtle-button">Registrar solicitud de ayuda</button><span id="helpCount" class="small muted">${help} registradas</span></div><p class="small muted">El facilitador registra cada solicitud. Anota por separado si brindó orientación sustantiva; pedir ayuda no significa haberla recibido. No se muestra una respuesta correcta.</p></section></div><div class="actions"><button id="withdraw" class="danger">Retirarme y borrar esta sesión</button></div>`;
 QUESTIONS.forEach((_,i)=>$('answer'+i).oninput=()=>{draft[i]=$('answer'+i).value;dirty=true;});
 $('answerForm').onsubmit=e=>{e.preventDefault();if(paused)return;const empty=draft.findIndex(x=>!x.trim());if(empty!==-1){$('answerError').innerHTML='<div class="error">Responda las cuatro preguntas. Si no sabe o necesita aclaración, puede escribirlo.</div>';$('answer'+empty).focus();return;}log('review_opened');stage='summary';render();};
 $('pauseBtn').onclick=()=>{if(paused){manualPause=false;paused=false;startClock();log('resumed');}else{stopClock();manualPause=true;paused=true;log('paused');}renderTask();};
 $('helpBtn').onclick=()=>{help++;log('help_requested');$('helpCount').textContent=help+' registradas';};
 $('withdraw').onclick=withdraw;
 if(paused){$('taskArea').classList.add('hidden');}
}
function renderSummary(){app.innerHTML=`<span class="eyebrow">Caso ${round+1} de 2</span><h1>Revise lo que ha explicado</h1>${progress(2)}<div class="grid"><section class="card"><h2>Respuestas preparadas</h2>${QUESTIONS.map((q,i)=>`<label>${q}</label><div class="answer">${esc(draft[i])}</div>`).join('')}<p class="small muted">Puede editar antes de registrar. Sus respuestas no han sido calificadas.</p><div class="actions"><button id="edit">← Volver y editar</button><button id="submit" class="primary">Registrar respuestas</button></div></section><aside class="card blue"><h2>Antes de continuar</h2><p>Compruebe que sus respuestas expresan lo que entendió. Es válido mantener una duda o una respuesta incompleta.</p><p>Registrar finaliza este caso. No envía una solicitud al GORE ni valida una subsanación.</p><span class="badge">Registro local de investigación</span><div class="actions"><button id="withdraw" class="danger">Retirarme y borrar</button></div></aside></div>`;
 $('edit').onclick=()=>{log('returned_to_edit');stage='task';render();};$('submit').onclick=()=>{stopClock();const c=current();records.push({caseId:c.key,format:c.format,order:round+1,answers:draft.map(s=>s.trim()),activeSeconds:activeSeconds(),helpRequests:help,submittedAt:new Date().toISOString(),rating:{critical:'',scores:['','','',''],helpConfirmed:'',notes:'',reviewer:'',status:'pendiente'}});log('response_registered');dirty=true;stage=round===0?'between':'done';if(stage==='done')session.finishedAt=new Date().toISOString();render();};$('withdraw').onclick=withdraw;
}
function renderBetween(){app.innerHTML=`<div class="card" style="max-width:750px;margin:35px auto"><span class="eyebrow">Caso 1 de 2 registrado</span><h1>Primera tarea completada.</h1><p>Ahora revisará otro caso del ejercicio. La tarea es la misma: explicar qué se observó, por qué, qué corregiría y qué evidencia presentaría.</p><div class="note">Sus respuestas se conservan durante esta sesión. La revisión del facilitador se realiza después de completar ambos casos.</div><div class="actions"><button id="withdraw" class="danger">Retirarme y borrar</button><button id="nextCase" class="primary">Abrir segundo caso →</button></div></div>`;$('nextCase').onclick=()=>{round=1;beginRound();};$('withdraw').onclick=withdraw;}
function renderDone(){app.innerHTML=`<div class="grid landing"><section><span class="eyebrow">Recorrido completado</span><h1>Gracias por compartir<br>su interpretación.</h1><p class="intro">Las dos respuestas quedaron registradas en esta sesión. El facilitador las revisará con una pauta técnica.</p><div class="note">Esto no es una calificación laboral ni una aprobación técnica. Aún no hay una conclusión sobre la hipótesis.</div><p class="privacy">Si desea retirar su participación, puede borrar la sesión. Si el facilitador ya descargó un registro, debe solicitarle también que elimine esa copia.</p><div class="actions" style="justify-content:flex-start"><button id="withdraw" class="danger">Retirar y borrar sesión</button></div></section><section class="card"><h2>Registro de la sesión</h2><div class="row"><span class="badge">${esc(session.code)}</span><span class="badge">${session.kind==='ensayo'?'Ensayo técnico · excluir del análisis':'Prueba con persona real · declarada'}</span></div><hr class="divider">${records.map(r=>`<div class="row between"><span>Caso ${r.order} · ${r.caseId}</span><span>Respuesta registrada</span></div>`).join('<hr class="divider">')}<p class="small muted" style="margin-top:25px">No se guarda automáticamente. El facilitador debe revisar y descargar el registro antes de cerrar.</p><div class="actions"><button id="goReview" class="primary">Continuar como facilitador →</button></div></section></div>`;$('goReview').onclick=openReview;$('withdraw').onclick=withdraw;}

function renderReview(){app.innerHTML=`<span class="eyebrow">Uso exclusivo del facilitador</span><h1>Revisar antes de concluir.</h1><p class="intro">La aplicación registra. Una persona valora la comprensión. Ninguna respuesta se aprueba automáticamente.</p>${!session?'<div class="empty">No hay una sesión para evaluar. Inicie un ensayo o una prueba desde «Sesión».</div>':`<div class="note ${session.kind==='ensayo'?'warn':''}"><strong>${session.kind==='ensayo'?'ENSAYO TÉCNICO: no incluir como evidencia de usuarios.':'Prueba real declarada por el facilitador.'}</strong> Código ${esc(session.code)} · ${esc(session.role)} · ${session.sequence}. La aplicación no verifica la identidad ni acredita por sí misma que una sesión ocurrió.</div>${records.map((r,i)=>`<section class="card" style="margin:22px 0"><div class="row between"><h2>Caso ${r.order}: ${esc(CASES[r.caseId].title)}</h2><span class="badge">${r.format}</span></div><div class="row small muted"><span>Tiempo activo: ${r.activeSeconds} s</span><span>Solicitudes de ayuda: ${r.helpRequests}</span><span>${esc(r.submittedAt)}</span></div><div class="note">El tiempo incluye lectura, escritura y revisión. Excluye pausa y pestaña oculta. No demuestra por sí solo menor esfuerzo.</div>${QUESTIONS.map((q,j)=>`<label>${q}</label><div class="answer">${esc(r.answers[j])}</div><p class="small"><strong>Pauta didáctica:</strong> ${esc(CASES[r.caseId].rubric[j])}</p>`).join('')}<p class="small muted">2 = contiene todos los elementos esenciales; 1 = parcial; 0 = incorrecta o no identifica lo solicitado. Acepte paráfrasis; no exija repetir palabras. Dos revisores deben resolver diferencias antes de cerrar el análisis.</p><form id="rating${i}"><div class="review-fields">${['Hallazgo','Fundamento','Corrección','Evidencia'].map((s,j)=>`<div class="field"><label for="score${i}_${j}">${s}</label><select id="score${i}_${j}" required><option value="">Sin evaluar</option><option value="2">2 · Completa</option><option value="1">1 · Parcial</option><option value="0">0 · Incorrecta / no sabe</option></select></div>`).join('')}</div><div class="grid"><div class="field"><label for="help${i}">¿Sin ayuda sustantiva durante todo el caso?</label><select id="help${i}" required><option value="">Confirmar</option><option value="si">Sí, confirmado por observación</option><option value="no">No / hubo orientación</option></select></div><div class="field"><label for="reviewer${i}">Código del revisor</label><input id="reviewer${i}" type="text" maxlength="16" pattern="(?:[A-Za-z0-9_]|-)+" required placeholder="Ej. R01" value="${esc(r.rating.reviewer)}"></div></div><div class="field"><label for="critical${i}">¿Hubo una interpretación técnicamente perjudicial?</label><select id="critical${i}" required><option value="">Confirmar según pauta acordada</option><option value="no">No observada</option><option value="si">Sí · describir en las notas</option></select></div><label for="notes${i}">Notas: conducta, declaración e interpretación por separado</label><textarea id="notes${i}" maxlength="4000" placeholder="Conducta observada: …\nDeclaración literal: …\nInterpretación del equipo: …\nIncidentes / ayudas no registradas: …">${esc(r.rating.notes)}</textarea><div class="actions"><button type="submit" class="primary">Guardar evaluación del caso ${r.order}</button></div></form><p id="result${i}" class="status" role="status">${result(r)}</p></section>`).join('')}<section class="card"><h2>Conservar el registro</h2><p>Descargue el JSON para conservar respuestas, eventos y valoración. El CSV resume cada caso. No se calculan resultados grupales ni se declara validada HS01.</p><div class="row"><button id="jsonBtn" class="primary">Descargar registro JSON</button><button id="csvBtn">Descargar resumen CSV</button><button id="newSession">Nueva sesión</button></div><p id="exportStatus" class="status" role="status"></p><p class="privacy">Guarde los archivos en una carpeta autorizada con acceso limitado. El equipo define responsable y plazo de eliminación. No los envíe a servicios externos sin autorización.</p></section>`}`;
 if(!session)return;
 records.forEach((r,i)=>{r.rating.scores.forEach((s,j)=>$('score'+i+'_'+j).value=s);$('help'+i).value=r.rating.helpConfirmed;$('critical'+i).value=r.rating.critical;
 const capture=()=>{r.rating.scores=[0,1,2,3].map(j=>$('score'+i+'_'+j).value);r.rating.helpConfirmed=$('help'+i).value;r.rating.critical=$('critical'+i).value;r.rating.reviewer=$('reviewer'+i).value.trim();r.rating.notes=$('notes'+i).value;r.rating.status='pendiente';dirty=true;$('result'+i).textContent='Cambios pendientes: guarde la evaluación.';};
 $('rating'+i).oninput=capture;$('rating'+i).onchange=capture;$('rating'+i).onsubmit=e=>{e.preventDefault();capture();if(r.rating.critical==='si'&&!r.rating.notes.trim()){$('result'+i).textContent='Describa la interpretación perjudicial en las notas antes de guardar.';$('notes'+i).focus();return;}r.rating.status='evaluado';r.rating.evaluatedAt=new Date().toISOString();log('manual_rating_saved',{case:r.caseId});$('result'+i).textContent=result(r);};});
 $('jsonBtn').onclick=()=>exportData('json');$('csvBtn').onclick=()=>exportData('csv');$('newSession').onclick=()=>confirmAction('Comenzar otra sesión','Descargue primero el registro si debe conservarlo. La nueva sesión eliminará del navegador las respuestas actuales.','Nueva sesión',reset);
}
function download(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportData(type){const safe=session.code.replace(/[^A-Za-z0-9_-]/g,'_');const name='Observa_'+safe+'_'+session.id;
 if(type==='json'){download(name+'.json',JSON.stringify({schema:'observa.hs01.v2',dataset:DATASET,exportedAt:new Date().toISOString(),session,cases:CASES,records,events,warning:'Los casos precargados son ficticios; los configurados tienen la procedencia declarada en dataset. La calidad real y procedencia de los registros debe ser verificada por el equipo. Ensayos técnicos no son evidencia. La procedencia del comparador consta en dataset. La opción institucional es una declaración del equipo, no una verificación automática.'},null,2),'application/json');}
 else{const heads=['sesion','referencia','version_casos','tipo','codigo','rol','secuencia','caso','formato','orden','segundos_activos','solicitudes_ayuda','hallazgo','fundamento','correccion','evidencia','puntaje_hallazgo','puntaje_fundamento','puntaje_correccion','puntaje_evidencia','sin_ayuda_confirmada','interpretacion_perjudicial','estado_evaluacion','resultado','revisor','notas'];const rows=records.map(r=>[session.id,session.referenceType,session.datasetVersion,session.kind,session.code,session.role,session.sequence,r.caseId,r.format,r.order,r.activeSeconds,r.helpRequests,...r.answers,...r.rating.scores,r.rating.helpConfirmed,r.rating.critical,r.rating.status,result(r),r.rating.reviewer,r.rating.notes]);download(name+'.csv','\uFEFF'+[heads,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
 dirty=false;$('exportStatus').textContent='Descarga solicitada. Compruebe que el archivo aparece en su carpeta de descargas.';}

function renderGuide(){app.innerHTML=`<span class="eyebrow">Guía de la tribu · E2 → aprendizaje para S10</span><h1>Comprender antes de ampliar.</h1><div class="note"><strong>Apertura y operación local:</strong> abra el HTML en Chrome o Edge. No requiere instalación ni internet. El facilitador asigna S1–S4, registra incidencias en una ficha manual y, al finalizar, transcribe esas notas en la evaluación. Exporte JSON y CSV antes de cerrar. La sesión no se guarda automáticamente.</div><p class="intro">HS01 es una hipótesis de trabajo pendiente de ratificación: la presentación estructurada mejora la interpretación autónoma de una observación frente al formato habitual.</p><div class="grid"><section class="card"><h2>Una sola tarea central</h2><p>Interpretar una observación mediante cuatro respuestas: qué se observó, por qué, qué corregir y qué evidencia presentar. La tarea se repite en dos casos distintos para explorar la diferencia entre formatos.</p><p>Se aprovechan las cuatro secciones del concepto de E2. Se excluyen adjuntos, estados del trámite y envío institucional porque no son necesarios para comprobar comprensión.</p><div class="note warn">Los ejemplos incluidos son ficticios. Con ellos se explora el mecanismo de comprensión, no se demuestra superioridad frente al procedimiento actual del GORE.</div></section><section class="card"><h2>Antes de invitar a usuarios</h2><ol><li>Ratificar HS01. Los evaluadores deben revisar los mismos antecedentes y acordar la respuesta suficiente y los errores críticos. Distinguir diferencias en hechos, criterios y redacción. Si persiste un desacuerdo técnico de fondo, priorizar HS05 antes de probar comprensión. El acuerdo sobre dos casos no valida HS05 para toda la institución.</li><li>Para comparación institucional, usar «Configurar casos», material autorizado y anonimizado. Confirmar fidelidad y dificultad equivalente.</li><li>Acordar elegibilidad, secuencias, criterio de éxito, consentimiento, responsable y plazo de eliminación de archivos.</li><li>Realizar un ensayo técnico; sus registros se excluyen de la evidencia.</li></ol></section></div><details open><summary>Acuerdos de la tribu: cómo interpretar los resultados</summary><p>Una explicación correcta en un caso demuestra comprensión en ese caso; por sí sola no prueba que la ficha mejore el formato habitual. Si falta un cronograma original, registrar la barrera documental por separado: no convertirla en un error de comprensión.</p><p>La disponibilidad de documentos y su vinculación pertinente a una corrección son problemas distintos. HS02 requiere comprobar la vinculación y suficiencia del sustento; añadir adjuntos no resuelve por sí solo la ausencia del documento.</p><p>Si ambos formatos permiten interpretaciones igualmente completas, no recomendar la sustitución por apariencia. Revisar evidencia de barreras documentales (HS02) o desacuerdos técnicos (HS05) antes de reorientar. Estas respuestas de la tribu son criterios de decisión, no nuevos resultados de usuarios.</p></details><details open><summary>Prueba breve · propuesta de 10–12 minutos por persona</summary><p>1 minuto de contexto y consentimiento; hasta 4 minutos orientativos por caso; 2–3 minutos de preguntas posteriores. No hay corte automático. Si un caso queda incompleto, registrarlo y no ocultarlo.</p><p><strong>Consigna:</strong> «Revise la observación y explique qué se ha observado, por qué se solicita la corrección, qué prepararía y qué documentos presentaría. Puede consultar el texto y expresar dudas».</p><p>No enseñar la pauta, dar ejemplos de respuesta ni explicar los términos técnicos durante la tarea. Registrar toda ayuda. Al terminar: ¿qué le permitió entender la observación?, ¿qué le generó dudas?, ¿qué comprobaría antes de preparar una respuesta real?</p><p>Utilizar S1–S4 en orden previamente asignado, sin elegir según habilidad. Dos casos distintos reducen la repetición del mismo contenido, pero pueden introducir diferencias de dificultad; revisar resultados por caso, rol y orden. No mezclar versiones del material.</p></details><details open><summary>Métrica y criterio de éxito propuesto</summary><p><strong>Métrica primaria:</strong> diferencia entre la proporción de participantes con comprensión completa sin ayuda en formato estructurado y en formato continuo. Comprensión completa = los cuatro componentes reciben 2 puntos según la pauta humana, sin ayuda sustantiva ni interpretación crítica perjudicial. Una solicitud de ayuda no equivale a orientación recibida: el revisor debe contrastarla con las notas de la sesión.</p><p><strong>Propuesta exploratoria, no estándar:</strong> 8 personas elegibles que preparen o coordinen subsanaciones, dos por secuencia. Con 8 pares completos, obtener al menos 7/8 éxitos con la ficha y al menos 2 éxitos netos adicionales frente al texto continuo, sin errores críticos perjudiciales. «Netos» = éxitos con ficha menos éxitos con texto continuo; por ejemplo, el cálculo se hace con registros reales, nunca con ejemplos inventados.</p><p>La tribu debe justificar antes de ejecutar por qué toleraría como máximo una dificultad no crítica entre ocho y qué ganancia compensaría el cambio de formato. Acordar errores críticos con el especialista. No modificar el umbral después de observar los datos. Es una señal de aprendizaje, no prueba estadística.</p><p>Reportar n/N de participantes convocados, consentidos, iniciados, completados, con ayuda y retirados según lo autorizado; sin conservar datos de quienes retiren consentimiento. No reemplazar selectivamente resultados desfavorables. Si faltan pares completos, el criterio grupal queda inconcluso. No generalizar una muestra pequeña o no representativa.</p></details><details><summary>Resultados posibles y reglas de decisión</summary><table><thead><tr><th>Resultado</th><th>Interpretación y decisión</th></tr></thead><tbody><tr><td>Favorable</td><td>Se cumple el criterio, sin errores críticos, y la diferencia no se explica solo por caso, rol u orden. Perseverar en el concepto y avanzar a comprobar HS02. Con comparador ficticio, confirmar primero la pertinencia frente a una referencia institucional.</td></tr><tr><td>Ambiguo</td><td>Ambos formatos funcionan igual, hay techo de desempeño, ayuda, datos faltantes o diferencias de dificultad. No afirmar ventaja. Modificar el material o completar la evidencia conservando el registro de versiones.</td></tr><tr><td>Desfavorable</td><td>La ficha empeora el desempeño o no resuelve errores relevantes. Revisar contenido e interacción. Un resultado negativo aislado no demuestra una causa alternativa.</td></tr><tr><td>Pivotar</td><td>Solo si evidencia convergente identifica otra barrera predominante, como criterios técnicos contradictorios o ausencia de documentos. Reorientar el servicio, no solo cambiar la interfaz.</td></tr><tr><td>Detener</td><td>Contenido incorrecto, consentimiento ausente, exposición de información o imposibilidad de proteger registros. Si hay un error crítico recurrente, suspender la ampliación y revisar su causa. Corregir antes de reanudar.</td></tr></tbody></table></details><details><summary>Intervención manual, plazo y recursos</summary><p><strong>Manual:</strong> el facilitador asigna el orden y registra ayudas. Después de los dos casos, el revisor califica las cuatro respuestas, declara si hubo ayuda y errores críticos, y guarda cada evaluación. El JSON conserva respuestas, material, eventos y valoración; el CSV resume los casos. La consolidación grupal se hace fuera del MVP. Contrastar desacuerdos con un segundo revisor, preferiblemente sin conocer el formato.</p><p><strong>Estimaciones propuestas:</strong> preparación y revisión del contenido, 60–90 minutos; ensayo, 15 minutos; ocho sesiones, 80–96 minutos; valoración y consolidación, 60–90 minutos; decisión, 20 minutos. Total aproximado: 4–5,5 horas de trabajo, sin reclutamiento, permisos ni esperas. Una sesión individual puede iniciarse después de acordar la pauta, confirmar elegibilidad, disponibilidad y consentimiento, y ensayar el funcionamiento local.</p><p><strong>Recursos:</strong> PC con Chrome o Edge, HTML local, facilitador, especialista técnico, participantes elegibles y carpeta autorizada. No se confirma disponibilidad ni presupuesto institucional. No se requiere servidor para el archivo descargable.</p></details><details><summary>Consentimiento, privacidad, seguridad y sesgos</summary><p>Participación voluntaria, sin consecuencias laborales ni presión jerárquica. Usar códigos; no ingresar nombres, DNI, identificadores de obras o documentos reservados. No hay grabación de audio o video. Mantener registros en carpeta con acceso limitado y plazo de eliminación acordado.</p><p>La aplicación no envía datos a un servidor y solo conserva la sesión en memoria. Exportar antes de cerrar; si la persona retira su consentimiento, borrar también las copias exportadas. La vista de evaluación no está protegida por contraseña: no compartirla durante la interacción.</p><p>No considerar «me gusta» o «lo usaría» como éxito. Observar respuestas y errores. Controlar familiaridad con los casos, aprendizaje por orden, ayuda del facilitador y sesgo de calificación. Los datos ficticios describen tareas; no representan feedback ni resultados de personas reales.</p></details><details><summary>Qué funciona y qué queda fuera</summary><p>Funcionan: configuración local de dos casos, cuatro órdenes, consentimiento, cuatro respuestas abiertas, revisión y edición, pausas, registro de ayudas, evaluación humana y exportación JSON/CSV. La navegación a guía y evaluación se bloquea durante la tarea.</p><p>Simulado: casos precargados y su comparador continuo. Una referencia institucional configurada es declarada por el equipo y debe corroborarse. Fuera de alcance: preparación completa de subsanaciones, adjuntos, aprobación técnica, envío al GORE, cuentas, persistencia automática, importación de sesiones e integración con el SGD. El tiempo es secundario y no mide duración del trámite.</p></details><details><summary>Cómo orienta el alcance de S10</summary><p>Si la comprensión mejora con una referencia pertinente, incorporar después la preparación de respuesta y evidencia consultable para comprobar HS02. Si persisten dificultades, ajustar comprensión antes de ampliar funciones. Si el problema se concentra en criterios o coordinación, cambiar el enfoque del servicio. HS08 y las condiciones de autorización y recursos siguen siendo requisitos antes de usar expedientes reales.</p><p>Este MVP no acredita menor reproceso, continuidad institucional, adopción ni sostenibilidad. Cada afirmación requiere su propia evidencia.</p></details><div class="actions"><button id="backSession" class="primary">Volver a la sesión</button></div>`;$('backSession').onclick=()=>{view='session';render();};}


function renderConfig(){if(session)return;app.innerHTML=`<span class="eyebrow">Configuración previa · solo facilitador</span><h1>Dos casos. El mismo contenido en ambos formatos.</h1><p class="intro">Los casos incluidos son ficticios. Para explorar HS01 frente a una referencia institucional, sustituya el contenido por dos observaciones anonimizadas y técnicamente revisadas.</p><div class="note warn">Conserve literalmente el texto y su orden al dividirlo en los cuatro bloques. La ficha añade títulos; el texto continuo une los mismos bloques. Si el formato habitual no puede representarse así fielmente, esta comparación NO representa el procedimiento actual. No copie nombres, identificadores ni información reservada.</div><form id="configForm"><section class="card"><div class="grid"><div class="field"><label for="referenceType">Procedencia del comparador</label><select id="referenceType"><option value="demo">Casos ficticios / referencia construida</option><option value="institucional">Referencia institucional anonimizada · declarada</option></select></div><div class="field"><label for="datasetVersion">Código de versión del material</label><input id="datasetVersion" type="text" maxlength="40" required value="${esc(DATASET.version)}"></div></div><div class="field"><label for="referenceNote">Descripción de procedencia y alcance (sin información reservada)</label><textarea id="referenceNote" required maxlength="1500">${esc(DATASET.note)}</textarea></div><label class="check"><input id="fidelity" type="checkbox"><span>Si declaro referencia institucional, confirmo autorización, anonimización, fidelidad del texto continuo al formato habitual y revisión de equivalencia de dificultad de los dos casos. Es una declaración del equipo, no una verificación automática.</span></label></section>${['A','B'].map(k=>`<details open><summary>Caso ${k}</summary><div class="field"><label for="title${k}">Título del caso</label><input type="text" id="title${k}" maxlength="150" required value="${esc(CASES[k].title)}"></div><div class="field"><label for="context${k}">Contexto para la persona participante</label><textarea id="context${k}" required maxlength="1500">${esc(CASES[k].context)}</textarea></div>${CASES[k].parts.map(([h,t],j)=>`<div class="field"><label for="part${k}${j}">${j+1}. ${esc(h)} · texto común a ambos formatos</label><textarea id="part${k}${j}" required maxlength="2500">${esc(t)}</textarea></div><div class="field"><label for="rubric${k}${j}">Pauta humana de valoración · ${esc(h)}</label><textarea id="rubric${k}${j}" required maxlength="1500">${esc(CASES[k].rubric[j])}</textarea></div>`).join('')}</details>`).join('')}<div id="configError" role="alert"></div><div class="actions"><button type="button" id="cancelConfig">Cancelar cambios</button><button type="button" id="defaultCases">Restaurar ejemplos ficticios</button><button class="primary" type="submit">Aplicar casos a las próximas sesiones</button></div></form><p class="privacy">Se conserva esta configuración mientras la pestaña permanezca abierta. Los casos completos y su versión se incluyen en cada JSON exportado. Al cerrar se pierden los cambios; no hay importación de materiales en esta versión.</p>`;
 $('referenceType').value=DATASET.source;$('cancelConfig').onclick=render;$('defaultCases').onclick=()=>confirmAction('Restaurar ejemplos','Esto sustituirá la configuración de los casos por los ejemplos ficticios originales.','Restaurar',()=>{CASES=JSON.parse(JSON.stringify(DEMO_CASES));DATASET={version:'DEMO-2.0',source:'demo',note:'Texto continuo de práctica construido para este MVP; no procede de expedientes del GORE.'};setup.checked=false;render();});
 $('configForm').onsubmit=e=>{e.preventDefault();if($('referenceType').value==='institucional'&&!$('fidelity').checked){$('configError').innerHTML='<div class="error">Confirme las condiciones de la referencia institucional o mantenga la clasificación de referencia construida.</div>';return}let next={};for(const k of ['A','B']){next[k]={id:( $('referenceType').value==='demo'?'DEMO-':'ANON-')+k,title:$('title'+k).value.trim(),context:$('context'+k).value.trim(),parts:CASES[k].parts.map(([h],j)=>[h,$('part'+k+j).value.trim()]),rubric:[0,1,2,3].map(j=>$('rubric'+k+j).value.trim())};if(!next[k].title||!next[k].context||next[k].parts.some(x=>!x[1])||next[k].rubric.some(x=>!x)){$('configError').innerHTML='<div class="error">Complete todos los campos con contenido no vacío.</div>';return}}
 const v=$('datasetVersion').value.trim(),note=$('referenceNote').value.trim();if(!v||!note){$('configError').innerHTML='<div class="error">Indique la versión y procedencia.</div>';return}CASES=next;DATASET={version:v,source:$('referenceType').value,note,fidelityDeclared:$('fidelity').checked};setup.checked=false;render();};focusHeading();}
